[workspace]
authors = ["Aishwarya Chander <aishwarya.chander@alleninstitute.org>"]
channels = ["conda-forge"]
name = "spatial-pcd-data-release"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
kernel = "python -m ipykernel install --user --name TissDiss --display-name 'Python (TissDiss)'"

[dependencies]
seaborn = ">=0.13.2,<0.14"
matplotlib = ">=3.10.8,<4"
ipykernel = ">=7.2.0,<8"
plotnine = ">=0.15.3,<0.16"
anndata = ">=0.12.10,<0.13"
scanpy = ">=1.12.3,<2"
pyarrow = ">=25.0.0,<26"
leidenalg = ">=0.12.0,<0.13"
openpyxl = ">=3.1,<4"

[pypi-dependencies]
scrublet = ">=0.2.3, <0.3"
harmonypy = ">=2.0.0, <3"
hisepy = ">=1.15.38, <2"

[feature.gpu.tasks]
kernel = "python -m ipykernel install --user --name rapids --display-name 'Python (rapids)'"

[feature.gpu.dependencies]
python = ">=3.12,<3.13"
pip = ">=24"
ipykernel = ">=7.2.0,<8"
anndata = ">=0.12.14,<0.13"
numpy = ">=1.24,<2.5"

[feature.gpu.pypi-dependencies]
dask-cuda = "*"
rapids-singlecell-cu13 = "*"
cudf-cu13 = "*"
cuml-cu13 = "*"
cugraph-cu13 = "*"
cuvs-cu13 = "*"
rmm-cu13 = "*"

[feature.gpu.pypi-options]
extra-index-urls = ["https://pypi.nvidia.com"]

[environments]
default = []
gpu = { features = ["gpu"], no-default-feature = true }
